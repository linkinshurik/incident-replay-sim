server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri /index.html;
    }

    # Proxy to backend for API paths to avoid CORS
    location /replay/ {
        proxy_pass http://backend:8080/replay/;
    }

    location /scenarios/ {
        proxy_pass http://backend:8080/scenarios/;
    }

    location /healthz {
        proxy_pass http://backend:8080/healthz;
    }

    location /metrics {
        proxy_pass http://backend:8080/metrics;
    }

    # optionally improve proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
